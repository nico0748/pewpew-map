name: ZAP Baseline Scan (Production)

# OWASP ZAP Baseline Scan による本番サイトの脆弱性診断（週次）
# - Baseline Scan は受動（パッシブ）スキャンのため、対象サイトへ攻撃的なリクエストは送らない
# - スキャン対象は自社で構築・運用しているサイトのみに限定すること
# - push / pull_request ごとの検査は security-scan.yml（CI ビルドを localhost で検査）が担当する
on:
  # 週次スキャン（毎週月曜 JST 09:xx）
  # 依存ライブラリの新規脆弱性や配信ヘッダの変化を継続的に検知する
  schedule:
    - cron: "45 0 * * 1"
  # 任意のタイミングで手動実行
  workflow_dispatch:

# action-baseline はスキャン結果を Issue として書き込むため issues: write が必要
permissions:
  contents: read
  issues: write

jobs:
  zap_baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          # スキャン対象の本番URL
          target: "https://pewpew-map.vercel.app/"
          token: ${{ secrets.GITHUB_TOKEN }}
          # 現行のメンテナンス済みイメージ（旧 owasp/zap2docker-stable は非推奨）
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          # -a : alpha 版を含む受動スキャンルールを有効化
          # -j : Ajax Spider を有効化（React SPA のクライアントレンダリング画面も巡回）
          # -z : ZAP オプション。アラート最大件数の制限を緩和
          cmd_options: >-
            -a
            -j
            -z "-config alert.maxInstances=0"
          # 誤検知の抑制ルールを置く場合はこのファイルを使う（任意）
          rules_file_name: ".zap/rules.tsv"
          # WARN レベルのアラートでワークフローを失敗させない
          # （Baseline は警告が多く出るため。FAIL レベルのみ気にする運用）
          fail_action: false
          # スキャン結果を Issue として自動作成・更新する
          allow_issue_writing: true
          # Actions の Artifact 名
          artifact_name: zap-baseline-report
