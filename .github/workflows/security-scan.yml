name: Security Scan (CI)

# GitHub Actions が走るたびに自動で回る脆弱性チェック
#   1. zap_local : CI 上でビルドした成果物をランナー内で配信し、OWASP ZAP Baseline で受動スキャン
#   2. npm_audit : 依存パッケージの既知脆弱性チェック
# 本番URL に対する週次スキャンは zap-baseline.yml を参照。
on:
  push:
    branches: [main, "claude/cyber-attack-visualization-ZqdAs"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_local:
    name: ZAP Baseline (CI build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ビルド成果物をランナー上の 8080 番で配信する。
      # zaproxy/action-baseline は docker を --network=host で起動するため
      # コンテナ内の ZAP から http://localhost:8080 に到達できる。
      - name: Serve built site
        run: |
          npx --yes serve@14 -s "dist" -l 8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:8080/; then
              echo "static server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::static server did not start"
          cat /tmp/serve.log
          exit 1

      - name: ZAP Baseline Scan (localhost)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080/"
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          # -a : alpha 版を含む受動スキャンルールを有効化
          # -j : Ajax Spider を有効化（SPA のクライアントレンダリング画面も巡回）
          # -z : アラート最大件数の制限を緩和
          cmd_options: >-
            -a
            -j
            -z "-config alert.maxInstances=0"
          rules_file_name: ".zap/rules.tsv"
          # WARN でワークフローを失敗させない（FAIL 指定したルールのみ落とす）
          fail_action: false
          # push / PR ごとに Issue を量産しないため無効。結果は Artifact で確認する
          allow_issue_writing: false
          artifact_name: zap-ci-report

  npm_audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "package-lock.json"

      # 本番依存に high 以上の既知脆弱性があればワークフローを失敗させる
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # dev 依存も含めた全体像はログで確認できるようにする（失敗させない）
      - name: npm audit (full report / non-blocking)
        if: always()
        run: npm audit || true
